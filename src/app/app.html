<app-toast-host />

@if (!isOnline()) {
  <div class="gc-offline-banner">
    <span>⚡</span>
    <span>Offline mode — data will sync when connected</span>
    @if (pendingCount() > 0) {
      <span class="gc-badge gc-badge-warn">{{ pendingCount() }} pending</span>
    }
  </div>
}

<header class="gc-header">
  <div class="gc-container gc-row-between">
    <div class="gc-header-brand">
      <span class="gc-header-logo">🐄</span>
      <span class="gc-header-title">GauConnect</span>
    </div>

    <button
      type="button"
      class="gc-role-btn"
      (click)="cycleRole()"
      [attr.aria-label]="'Switch role. Current role: ' + role()"
    >
      {{ role() }}
    </button>
  </div>
</header>

<main class="gc-main">
  <router-outlet />
</main>

<nav class="gc-bottom-nav" aria-label="Main navigation">
  @for (item of navItems(); track item.path + item.label) {
    <a
      class="gc-nav-item"
      [routerLink]="item.path"
      routerLinkActive="gc-nav-item-active"
      [routerLinkActiveOptions]="{ exact: item.path === '/collector' || item.path === '/admin' }"
    >
      <span class="gc-nav-icon">{{ item.icon }}</span>
      <span class="gc-nav-label">{{ item.label }}</span>
    </a>
  }
</nav>
