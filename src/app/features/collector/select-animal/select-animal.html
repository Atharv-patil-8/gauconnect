<div class="gc-container gc-stack">

  <button type="button" class="back-link" (click)="onBack()">← Change Farmer</button>

  @if (farmer(); as f) {

    <!-- Farmer header -->
    <div class="farmer-header">
      <div class="farmer-avatar">{{ f.name.charAt(0) }}</div>
      <div>
        <div class="farmer-name">{{ f.name }}</div>
        <div class="farmer-meta">{{ f.id }} · {{ f.village }}</div>
      </div>
    </div>

    <h2 class="section-title">Select Animal</h2>

    @if (animals().length === 0) {
      <div class="empty-state">
        <div class="empty-icon">🐄</div>
        <div class="empty-title">No animals registered</div>
        <div class="empty-sub">Register cattle for this farmer first</div>
      </div>
    } @else {
      <div class="animal-list">
        @for (animal of animals(); track animal.id) {
          <button
            type="button"
            class="animal-card"
            [class.animal-card-cow]="animal.type === 'Cow'"
            [class.animal-card-buffalo]="animal.type === 'Buffalo'"
            (click)="selectAnimal(animal)"
          >
            <div class="animal-icon">
              {{ animal.type === 'Cow' ? '🐄' : '🐃' }}
            </div>
            <div class="animal-info">
              <div class="animal-type">{{ animal.type }}</div>
              <div class="animal-reg">#{{ animal.registrationNumber }}</div>
              <div class="animal-meta">{{ animal.breed }} · {{ animal.ageYears }} yrs</div>
            </div>
            <div class="animal-arrow">→</div>
          </button>
        }
      </div>
    }

    <button type="button" class="gc-btn gc-btn-secondary" (click)="onCancel()">
      Cancel Collection
    </button>

  } @else {
    <div class="empty-state">
      <div class="empty-icon">❓</div>
      <div class="empty-title">Farmer not found</div>
      <button type="button" class="gc-btn gc-btn-primary" (click)="onCancel()">
        Back to Dashboard
      </button>
    </div>
  }

</div>
