<div class="gc-container gc-stack">

  <button type="button" class="back-link" (click)="onBack()">← Back to Dashboard</button>

  @if (!showBrowse()) {

    <!-- Scan mode -->
    <div class="scan-area">
      <div class="scan-frame" [class.scan-frame-active]="scanning()">
        <div class="scan-corner scan-corner-tl"></div>
        <div class="scan-corner scan-corner-tr"></div>
        <div class="scan-corner scan-corner-bl"></div>
        <div class="scan-corner scan-corner-br"></div>

        @if (scanning()) {
          <div class="scan-line"></div>
          <div class="scan-status">Scanning...</div>
        } @else {
          <div class="scan-icon">📷</div>
          <div class="scan-hint">Place farmer ID card in frame</div>
        }
      </div>

      <button
        type="button"
        class="gc-btn gc-btn-primary gc-btn-large"
        [disabled]="scanning()"
        (click)="onSimulateScan()"
      >
        {{ scanning() ? 'Scanning...' : '📷 SIMULATE SCAN' }}
      </button>

      <button
        type="button"
        class="gc-btn gc-btn-secondary"
        (click)="onBrowse()"
      >
        🔍 Browse Farmers
      </button>
    </div>

  } @else {

    <!-- Browse mode -->
    <div class="browse-header">
      <h2>Select Farmer</h2>
      <button type="button" class="link-btn" (click)="showBrowse.set(false)">
        ← Back to Scan
      </button>
    </div>

    <input
      type="text"
      class="farmer-search"
      placeholder="Search by name, ID, or mobile"
      [value]="searchQuery()"
      (input)="onSearchChange($any($event.target).value)"
      autocomplete="off"
    />

    @if (filteredFarmers().length === 0) {
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <div class="empty-title">No farmers found</div>
        <div class="empty-sub">Try a different search</div>
      </div>
    } @else {
      <div class="farmer-list">
        @for (farmer of filteredFarmers(); track farmer.id) {
          <button
            type="button"
            class="farmer-card"
            (click)="selectFarmer(farmer)"
          >
            <div class="farmer-avatar">
              {{ farmer.name.charAt(0) }}
            </div>
            <div class="farmer-info">
              <div class="farmer-name">{{ farmer.name }}</div>
              <div class="farmer-meta">{{ farmer.id }} · {{ farmer.village }}</div>
            </div>
            <div class="farmer-arrow">→</div>
          </button>
        }
      </div>
    }

  }

</div>
